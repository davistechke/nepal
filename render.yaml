services:
  - type: web
    name: nepal-relief-funds
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Administrator
    # No database or disk block here on purpose - both require a paid plan
    # on Render. SQLite works out of the box on the free plan; it just
    # resets on every redeploy since the free plan's filesystem isn't
    # persistent. That's fine for a demo/prototype like this one.
